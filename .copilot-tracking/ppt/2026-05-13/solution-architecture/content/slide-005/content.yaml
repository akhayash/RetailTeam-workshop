speaker_notes: |
  Set up the three concepts the way the workshop guidance asks for them — not as three parallel builds but as one architecture told three ways. Concept A is the v1 we ship now: cloud-centric, Microsoft-only, governed. Concept B is the v2 expansion: edge devices and an AI agent that works alongside the in-store associate. Concept C is the v3 strategic move: a Microsoft Fabric–based semantic layer that turns fit data into cross-domain merchandising intelligence. The next three slides defend each concept in detail. Source: solution-architecture.md §6 (Architecture Concepts) and decision-register.md ADR-001.
