speaker_notes: |
  This is the slide where the room aligns. Read across each row: Concept A is the v1 because it ships fast, lets engineering focus on the fit feature, and enforces multi-tenant safety at the engine level. Concept B is the v2 because it extends in-store reach and gives the strongest privacy posture — but it adds device fleet and capex risk. Concept C is the v3 because it is the strategic move that only pays off after Concept A has produced 12+ months of fit data. Close on the eyebrow at the bottom — the sequencing is the architecture decision. Source: solution-architecture.md §6 and §9.
