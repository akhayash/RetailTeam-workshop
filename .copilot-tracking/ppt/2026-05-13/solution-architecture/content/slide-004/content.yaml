speaker_notes: |
  Three personas frame the architecture. The Online Shopper wants a confident size pick in under five seconds without uploading something they will regret. The Digital Transformation Leader is on the hook for measurable return-rate reduction and demands a multi-tenant platform that won't lock the company to a single brand. The Risk / Compliance Officer needs the architecture to survive GDPR Article 30 and EU AI Act scrutiny without exposing biometric liability. The eyebrow line is the workshop discipline: AI augments, humans stay accountable. Source: solution-architecture.md §4 (Stakeholders & Personas).
