speaker_notes: 'Listen for and coach toward the following behaviors after this slide
  is introduced:

  Strong Signals

  Architect explains why a Work IQ / Foundry IQ / Fabric IQ decision matters to the
  business

  Tradeoffs are discussed in terms of risk, cost, speed, or adoption

  AI is positioned as a means, not the outcome

  Recommendations are framed around value drivers, not architecture diagrams

  Coaching Opportunities

  Architect leads with features or tools instead of business impact

  “AI will help” statements without clarity on how work or decisions change

  Limited discussion of risk, governance, or adoption implications

  Over‑optimization for technical elegance at the expense of business clarity'
