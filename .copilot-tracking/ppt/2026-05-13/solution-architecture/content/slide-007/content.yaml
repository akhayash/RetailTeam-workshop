    text_color: '#0B5594'
    text_bold: true
    space_after: 6.0
  - text: An AI copilot assists the store associate by synthesizing real-time measurements and inventory; flagging poor fit before try-on; recommending alternatives. The associate retains accountability for the styling advice.
