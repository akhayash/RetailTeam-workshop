speaker_notes: |
  Concept B is the v2 expansion path. The architectural shift is from cloud-only to edge + cloud — pose detection runs on in-store devices, only low-confidence cases call the cloud, and a mobile copilot assists the store associate. Stress the human-in-the-loop framing in the AI + Human paragraph: the associate retains accountability, the AI just synthesizes. Tradeoffs are honest — we get the strongest privacy posture and the lowest latency at the cost of hardware capex and device management. The H-6 hypothesis (edge cost-justified) is what a pilot would settle. Source: solution-architecture.md §6.2.
