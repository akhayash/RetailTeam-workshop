speaker_notes: |
  Pair the technology with the outcome it earns. On the left, four value drivers — decision velocity (confident size recommendations, 30% returns reduction target), workforce productivity (associate and analyst copilots), operational resilience (multi-tenant safety, 60s TTL, audit trail), and growth enablement (fit data as a strategic asset). On the right, the Microsoft IQ framing — Work IQ is the in-workflow recommendation, Foundry IQ is the three-tier pipeline, Fabric IQ is the Concept C semantic layer. The IQs are enablers, not headlines — the drivers are what the business pays for. Source: solution-architecture.md §8.
