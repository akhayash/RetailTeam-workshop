speaker_notes: |
  The architecture is honest about what is verified and what is still a hypothesis. H-3 (multi-tenant safety via hierarchical PK) is Verified at compile time. H-1 (GPT-4o accuracy) and H-2 (the 70% confidence threshold) drive the riskiest behavior in the system and must be settled in integration and A/B testing before pilot. H-4 (60s TTL) and H-5 (rate limiting) are operational hypotheses with named tests. H-6 (edge cost) is the gate for Concept B. The status column is the asymmetry — we ship on H-1 verified by test, but production data is what truly settles it. Source: solution-architecture.md §10.
