speaker_notes: "Only ACA Ingress is internet-exposed. All data plane services use private endpoints. Managed identity replaces secrets everywhere. Tenant isolation is application-layer (JWT claims), not network-layer. NSG on private subnet denies all egress except Azure service IPs. Source: ADR-004, solution-architecture.md Section 7."
