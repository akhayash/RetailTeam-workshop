speaker_notes: |
  Concept A is what ships in v1. Walk through the five service pillars on the left — Container Apps for the API, Cosmos DB with hierarchical partition keys for multi-tenant safety, Blob with a 60-second TTL for privacy, the Microsoft AI trio for validation and extraction, and Service Bus for overflow when the synchronous path is too slow. On the right, name the tradeoffs honestly: we trade Azure portability for shipping speed, and we live with single-region in v1. Close on the hypothesis box: H-1 (accuracy) is verified by integration testing; H-2 (the 70% confidence threshold) is still a hypothesis we will validate with A/B testing. Source: solution-architecture.md §6.1, ADR-001, ADR-002, ADR-008.
