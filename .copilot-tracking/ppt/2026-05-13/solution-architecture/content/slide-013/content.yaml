speaker_notes: |
  Pair every commitment with what could break it. On the left, the five ADRs that define v1 — the three-tier pipeline, hierarchical partition keys for multi-tenant safety, Entra + managed identity (APIM deferred to v2), mandatory height input, and Clean Architecture. On the right, the five risks we are actively tracking — R-001 GPT-4o accuracy is CRITICAL (mitigated by the Tier 3 fallback), R-002, R-003, and R-007 are HIGH (each with a named mitigation), and R-005 is MEDIUM because the engine-level partitioning already enforces tenant isolation. The colored severity tokens make the risk profile readable at a glance. Source: decision-register.md and risk-register.md.
