  - text: ADR-001  ·  Three-tier AI pipeline
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#0B5594'
    text_bold: true
    space_after: 3.0
  - text: Validate (Vision + Content Safety + Defender) → Extract (GPT-4o JSON) → future SMPL only if H-1 fails.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: ADR-002  ·  Hierarchical partition keys
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#0B5594'
    text_bold: true
    space_after: 3.0
  - text: Cosmos DB partitioned by tenant + body + assessment — engine-level multi-tenant safety.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: ADR-004  ·  Entra ID + managed identity (APIM deferred)
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#0B5594'
    text_bold: true
    space_after: 3.0
  - text: Zero secrets in the v1 path; APIM deferred to v2 once multi-tenant onboarding patterns settle.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: ADR-008  ·  Height as mandatory scale reference
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#0B5594'
    text_bold: true
    space_after: 3.0
  - text: Without it, monocular pose estimation collapses; we choose explicit input over silent inaccuracy.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: ADR-011  ·  Clean Architecture (handler-per-use-case)
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#0B5594'
    text_bold: true
    space_after: 3.0
  - text: Each use case is a handler with isolated dependencies — keeps Tier 2 swap-out (SMPL) low-risk.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 4.0
