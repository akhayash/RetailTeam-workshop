  paragraphs:
  - text: CRITICAL  ·  R-001 GPT-4o accuracy in the wild
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#B7410E'
    text_bold: true
    space_after: 3.0
  - text: H-1 is verified by integration testing only — production variability is the unknown. Mitigation — Tier 3 SMPL fallback documented in ADR-001.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: HIGH  ·  R-002 Azure AI Vision feature deprecation
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#F79646'
    text_bold: true
    space_after: 3.0
  - text: People detection and image moderation are on Microsoft's deprecation track. Mitigation — abstract the validation interface, monitor roadmap.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: HIGH  ·  R-003 Non-deterministic LLM output drift
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#F79646'
    text_bold: true
    space_after: 3.0
  - text: Same image, different day, different measurement. Mitigation — versioned prompts, temperature pinned, structured-output schema enforced.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: HIGH  ·  R-007 Regulatory drift on biometric data
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#F79646'
    text_bold: true
    space_after: 3.0
  - text: EU AI Act and US state laws are moving. Mitigation — 60s blob TTL, consent capture in OpenAPI, DPIA before pilot expansion.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 10.0
  - text: MEDIUM  ·  R-005 Multi-tenant data leakage
    text_font: Segoe Sans Display
    text_size: 13
    text_color: '#8064A2'
    text_bold: true
    space_after: 3.0
  - text: Cross-tenant query at the API layer. Mitigation — Cosmos hierarchical PK at the engine level + claim-based tenant filter in middleware.
    text_font: Segoe Sans Display
    text_size: 12
    text_color: '#1F1F1F'
    space_after: 4.0
