# Partition key note
- type: textbox
  left: 0.5
  top: 5.3
  width: 12.333
  height: 0.5
  text: "Hierarchical partition key: /tenantId → /entityType → /entityId. Repository<T> enforces tenant context — cross-tenant queries fail to compile."
  font: Segoe Sans Display
  font_size: 11
  font_color: '#0B5594'
  italic: true
  alignment: left
  z_order: 8
speaker_notes: "Every container except tenants partitions by /tenantId for physical isolation. The tenants container uses /id because admin cross-tenant lookup is required. TTL on assessments enables automatic compliance. Audit entries are immutable and append-only. Source: ADR-002, data-model.md."
