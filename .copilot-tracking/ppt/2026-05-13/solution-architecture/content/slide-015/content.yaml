speaker_notes: |
  Close on the question and the commitments. Read the question aloud — Why this architecture, why now, what would change our mind? Then walk through the four commitments. Concept A ships because we owe the business a measurable return inside six months. Tier 2 will be reopened the moment H-1 fails — that is the contract, not a hope. Concept B is a v2 pilot in 12–18 months, gated on shopper trust data and store-fleet readiness. Concept C is the v3 strategic deepening, gated on Concept A producing the data that justifies the Fabric investment. The commitments are how we hold ourselves accountable. Source: solution-architecture.md §9 and §11.
