speaker_notes: "Each environment is an isolated Azure subscription with identical Bicep templates. Promotion is unidirectional with manual gates. Production runs across three availability zones. Cosmos continuous backup provides point-in-time restore within 30 days. Source: solution-architecture.md Section 9."
