speaker_notes: |
  This is the workshop Phase A frame: five lenses we ran the AI Clothing Fit Assessment Agent through. Walk the room left to right — Tech Stack (the Microsoft choices we made and ADRs that back them), Limitations (what hurts: Vision retirement, GPT-4o non-determinism, accuracy ceilings), Patterns (Clean Architecture and multi-tenant from day one — these are decided), Owners (who owns what across Engineering, Platform, Data, Security, and Product), and Personas (a preview of slide 4). Emphasize the discipline: every claim is labeled and cited. Source: research.md, decision-register.md, solution-architecture.md §3.
