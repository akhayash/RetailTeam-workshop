speaker_notes: |
  Frame the problem first: clothing returns drive 25–40% of online apparel revenue back through the warehouse, and the obvious biometric fixes hit privacy walls. Then present the solution: a multi-tenant .NET 8 service on Azure Container Apps with a three-tier Microsoft-only AI pipeline that purges photos in under 60 seconds and keeps the human in the decision loop. The point of this slide is to set the boundary — what we are building and what we are not (we are not replacing human judgment, we are not building biometrics). Source: solution-architecture.md §1.
