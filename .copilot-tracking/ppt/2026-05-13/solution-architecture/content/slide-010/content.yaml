layout: 4_Title and Content
speaker_notes: |
  Walk left to right. A POST from the frontend hits auth and rate limiting, the image lands in-memory or in a short-lived blob, Tier 1 runs three safety checks in parallel, Tier 2 extracts measurements with GPT-4o, the result is compared against the garment's size data, and the response is returned with a full audit trail while the image is purged. Anchor on the latency strip: p95 must stay under 5 seconds; when depth crosses 50 or the synchronous path slips past 4 seconds, the request goes async via Service Bus. Source: solution-architecture.md §7, openapi.yaml, ADR-006.
