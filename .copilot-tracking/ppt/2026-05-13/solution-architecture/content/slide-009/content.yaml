speaker_notes: |
  This is the Concept A engine. Tier 1 is three safety checks in parallel — Azure AI Vision rejects multi-person or no-person images, Content Safety blocks minors and explicit content, Defender for Storage screens for malware. Tier 2 is the GPT-4o Vision extraction — structured JSON, height as the mandatory scale reference, prompts versioned in source so every decision is auditable. Tier 3 is the deterministic SMPL body model we will swap in if H-1 fails integration testing. Each tier cites its ADR so the room can audit the decision trail. Source: solution-architecture.md §6.1, ADR-001, ADR-008, ADR-012.
