speaker_notes: |
  Concept C is the v3 strategic move. It only makes sense after Concept A has produced 12+ months of fit data — that is when joining fit confidence to returns, profiles, and catalog data starts paying off. The AI + Human paragraph keeps the discipline: a Fabric-based copilot augments the merchandising analyst's catalog work, but the analyst owns the decisions. Tradeoffs are real — Fabric is capex-heavy, and the time-to-insight beyond the initial fit feature is long. The trigger note in the bottom box makes the dependency on Concept A explicit. Source: solution-architecture.md §6.3.
