[project]
name = "fit-signal-poc"
version = "0.1.0"
description = "Photo-based fit signal PoC for size recommendation (MediaPipe + OpenCV)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.3",
    "scipy>=1.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "tqdm>=4.66",
    "pydantic>=2.7",
    # Streamlit live-camera demo
    "streamlit>=1.36",
    "streamlit-webrtc>=0.47",
    "av>=12.0",
]

[project.optional-dependencies]
# Activate when Week 3+ wants segmentation / depth / 3D body fitting on GPU.
# NOTE: PyTorch CUDA wheels are installed via index URL — see README.
gpu = [
    "torch>=2.3",
    "torchvision>=0.18",
    "onnxruntime-gpu>=1.18; platform_system == 'Windows'",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
